name: Source request
description: Suggest a new source
labels: [Source request]
body:
  - type: input
    id: name
    attributes:
      label: Source name
      placeholder: |
        Example: "RealDex"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Source URL
      placeholder: |
        Example: "https://realdex.com"
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      placeholder: |
        Example: "English"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.
          Example:
            "18+NSFW = yes"

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your issue will be closed if you haven't done these steps
      options:
        - label: I have checked that the extension does not already exist by searching the [extension listing](https://github.com/goosefarmer-afk/tsukimichi-extensions/tree/main/extensions) and verified it does not exist.
          required: true
        - label: I have search the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true
        - label: I have written a meaningful title with the source name.
          required: true
        - label: I will fill out all the requested information in this form.
          required: true

  - type: textarea
    attributes:
      label: <!-- footer -->
      description: Do **not** modify. This is a reminder for other users to vote.
      value: |
        ---

        Add a :+1: [reaction] to [issues you find important].

        [reaction]: https://github.blog/2016-03-10-add-reactions-to-pull-requests-issues-and-comments/
        [issues you find important]: https://github.com/goosefarmer-afk/tsukimichi-extensions/issues?q=is%3Aissue+is%3Aopen+sort%3Areactions-%2B1-desc
